<div class="min-h-dvh bg-slate-100 dark:bg-slate-950 text-slate-950 dark:text-slate-50">
  <header class="border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4 sm:px-8">
      <a routerLink="/guardian" class="flex items-center gap-3">
        <span class="grid size-10 place-items-center rounded-lg bg-emerald-400 font-semibold"
          >B</span
        >
        <div>
          <p class="text-sm font-medium text-slate-500 dark:text-slate-400">
            {{ 'shell.brand' | translate }}
          </p>
          <h1 class="text-xl font-semibold tracking-normal">
            {{ 'shell.dashboardTitle' | translate }}
          </h1>
        </div>
      </a>

      <div class="flex items-center gap-2">
        @if (helpTopic()) {
          <button
            #helpTrigger
            type="button"
            class="grid size-10 place-items-center rounded-full border border-slate-200 text-lg font-semibold text-slate-700 hover:bg-slate-100 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800"
            [class.bg-emerald-50]="helpOpen()"
            [class.dark:bg-emerald-950]="helpOpen()"
            [attr.aria-expanded]="helpOpen()"
            [attr.aria-controls]="helpPanelId"
            (click)="toggleHelp()"
          >
            <span aria-hidden="true">?</span>
            <span class="sr-only">{{ 'shell.help.toggle' | translate }}</span>
          </button>
        }
        <app-profile-menu />
      </div>
    </div>
  </header>

  @if (helpOpen()) {
    @if (helpTopic(); as topic) {
      <div #helpRegion class="mx-auto max-w-7xl px-6 pt-6 sm:px-8">
        <app-help-panel [topic]="topic" [panelId]="helpPanelId" (closed)="closeHelp()" />
      </div>
    }
  }

  <router-outlet (activate)="onActivate()" />
</div>

@let state = saving.state();

<section
  class="rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 p-4 shadow-sm sm:p-6"
>
  <h3 class="text-lg font-semibold tracking-normal">
    {{ 'sleepDiary.hygiene.title' | translate }}
  </h3>
  <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
    {{ 'sleepDiary.hygiene.help' | translate }}
  </p>

  <label class="sr-only" for="sleepHygieneNotes">{{
    'sleepDiary.hygiene.label' | translate
  }}</label>
  <textarea
    id="sleepHygieneNotes"
    rows="3"
    maxlength="4000"
    class="field-sizing-content mt-3 min-h-20 w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 dark:bg-slate-800 dark:text-slate-100"
    [ngModel]="text()"
    [ngModelOptions]="{ standalone: true }"
    (ngModelChange)="text.set($event)"
  ></textarea>

  @if (state.status === 'error') {
    <p class="mt-2 text-sm text-red-600 dark:text-red-400">{{ state.message | translate }}</p>
  }

  <div class="mt-3 flex items-center gap-3">
    <button
      type="button"
      class="rounded-lg bg-emerald-600 dark:bg-emerald-500 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700 dark:hover:bg-emerald-400 disabled:bg-slate-300 disabled:text-slate-500 dark:disabled:bg-slate-700 dark:disabled:text-slate-400"
      [disabled]="locked() || !changed() || saving.busy()"
      (click)="save()"
    >
      {{ 'sleepDiary.hygiene.save' | translate }}
    </button>
    @if (justSaved()) {
      <span class="text-sm text-emerald-700 dark:text-emerald-400" role="status">{{
        'sleepDiary.hygiene.saved' | translate
      }}</span>
    }
  </div>
</section>

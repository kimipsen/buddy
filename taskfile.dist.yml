# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  GREETING: Hello, world!

tasks:
  hooks:install:
    desc: 'Install the AI documentation-sync git hook. Usage: task hooks:install AGENT=claude|codex|copilot'
    vars:
      RESOLVED_AGENT: '{{.AGENT | default "claude"}}'
    preconditions:
      - sh: 'case "{{.RESOLVED_AGENT}}" in claude|codex|copilot) exit 0 ;; *) exit 1 ;; esac'
        msg: 'AGENT must be one of: claude, codex, copilot (got "{{.RESOLVED_AGENT}}")'
    cmds:
      - git config core.hooksPath .devcontainer/git-hooks
      - git config hooks.doc-agent "{{.RESOLVED_AGENT}}"
      - |
        if ! command -v "{{.RESOLVED_AGENT}}" >/dev/null 2>&1; then
          echo "Warning: '{{.RESOLVED_AGENT}}' was not found on PATH — install/authenticate it before committing." >&2
        fi
      - echo "Installed git hooks (core.hooksPath=.devcontainer/git-hooks, doc-agent={{.RESOLVED_AGENT}})."

  hooks:uninstall:
    desc: Remove the AI documentation-sync git hook configuration
    cmds:
      - git config --unset core.hooksPath || true
      - git config --unset hooks.doc-agent || true
      - echo "Removed git hook configuration."

  test:
    desc: Run all tests (backend, then frontend)
    cmds:
      - task: test:backend
      - task: test:frontend

  test:backend:
    desc: Run backend tests
    dir: src/backend
    cmds:
      - dotnet test backend.slnx

  test:frontend:
    desc: Run frontend tests
    dir: src/frontend/buddy
    cmds:
      - npm test

  test:e2e:frontend:report:
    dir: src/frontend/buddy
    cmds:
      - npx playwright show-report

  test:e2e:
    desc: Run all e2e tests (frontend only, for now)
    cmds:
      - task: test:e2e:frontend

  test:e2e:frontend:
    desc: >-
      Run frontend e2e tests (Playwright). Needs Postgres, Keycloak, and
      Mailpit running (already true in the devcontainer); starts the API and
      Angular dev server itself. Run "npx playwright install --with-deps
      chromium" once per machine first.
    dir: src/frontend/buddy
    cmds:
      - npm run test:e2e

  test:mutation:
    desc: Run all mutation tests (backend, then frontend)
    cmds:
      - task: test:mutation:backend
      - task: test:mutation:frontend

  test:mutation:backend:
    desc: Run backend mutation tests (dotnet-stryker)
    dir: src/backend/buddy.IntegrationTests
    cmds:
      - dotnet tool restore
      - dotnet stryker

  test:mutation:frontend:
    desc: Run frontend mutation tests (Stryker)
    dir: src/frontend/buddy
    cmds:
      - npm run test:mutation

  test:mutation:frontend:batch:
    desc: >-
      Work through frontend mutation testing a few files at a time (see
      scripts/mutation-batch.sh), so it doesn't overwhelm the devcontainer.
      Re-run repeatedly to cover the whole codebase; results accumulate in
      reports/stryker-incremental.json as a baseline. Usage: task
      test:mutation:frontend:batch [BATCH_SIZE=5] [CONCURRENCY=1] [--
      --status|--reset|--dry-run]
    dir: src/frontend/buddy
    vars:
      BATCH_SIZE: '{{.BATCH_SIZE | default "5"}}'
      CONCURRENCY: '{{.CONCURRENCY | default "1"}}'
    cmds:
      - ./scripts/mutation-batch.sh --batch-size {{.BATCH_SIZE}} --concurrency
        {{.CONCURRENCY}} {{.CLI_ARGS}}

  test:mutation:frontend:changed:
    desc: >-
      Run frontend mutation tests only on files changed since a base commit
      (default: origin/master), reusing reports/stryker-incremental.json as a
      baseline if one exists. Usage: task test:mutation:frontend:changed
      [BASE=origin/master] [CONCURRENCY=1]
    dir: src/frontend/buddy
    vars:
      BASE: '{{.BASE | default "origin/master"}}'
      CONCURRENCY: '{{.CONCURRENCY | default "1"}}'
    cmds:
      - >-
        git fetch origin --quiet || echo "Warning: could not fetch origin,
        diffing against the local ref for {{.BASE}}" >&2
      - |
        FILES=$(git diff --name-only --diff-filter=ACM "{{.BASE}}"...HEAD -- 'src/app/**/*.ts' | grep -v '\.spec\.ts$' | paste -sd, -)
        if [ -z "$FILES" ]; then
          echo "No changed frontend source files since {{.BASE}}."
          exit 0
        fi
        echo "Mutating files changed since {{.BASE}}:"
        echo "$FILES" | tr ',' '\n' | sed 's/^/  /'
        npx stryker run --mutate "$FILES" --incremental --concurrency {{.CONCURRENCY}}

  deploy:
    desc: Build and (re)start the production stack (deploy/docker-compose.prod.yml)
    dir: deploy
    preconditions:
      - sh: test -f .env
        msg: "deploy/.env not found — copy deploy/.env.example to deploy/.env and fill in real values first."
    cmds:
      - docker compose -f docker-compose.prod.yml up -d --build

  deploy:azure:
    desc: Deploy backend + frontend + Keycloak + Postgres to Azure Container Apps (deploy/azure/deploy.sh)
    dir: deploy/azure
    preconditions:
      - sh: test -f .env
        msg: "deploy/azure/.env not found — copy deploy/azure/.env.example to deploy/azure/.env and fill in real values first."
    cmds:
      - ./deploy.sh

name: Backend tests

on:
  pull_request:
    paths:
      - "src/backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [master]
    paths:
      - "src/backend/**"
      - ".github/workflows/backend-tests.yml"

# Least privilege for the GITHUB_TOKEN; a job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same SDK as the devcontainer, pinned in global.json at the repo root.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/backend/backend.slnx

      - name: Build
        run: dotnet build src/backend/backend.slnx --no-restore --configuration Release

      # Testcontainers needs a Docker daemon, which the ubuntu-latest runner provides natively.
      - name: Test
        run: dotnet test src/backend/backend.slnx --no-build --configuration Release --logger "console;verbosity=normal"

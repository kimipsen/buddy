<div
  class="w-full"
  [class.inline-flex]="!wrap()"
  [class.overflow-hidden]="!wrap()"
  [class.rounded-lg]="!wrap()"
  [class.border]="!wrap()"
  [class.border-slate-300]="!wrap()"
  [class.dark:border-slate-600]="!wrap()"
  [class.flex]="wrap()"
  [class.flex-wrap]="wrap()"
  [class.gap-1]="wrap()"
  role="radiogroup"
  [attr.aria-label]="ariaLabel() || null"
>
  @for (option of options(); track $index) {
    <button
      type="button"
      role="radio"
      [attr.aria-checked]="isSelected(option.value)"
      class="px-2 py-1.5 text-xs font-medium transition focus:z-10 focus:outline-none focus:ring-2 focus:ring-emerald-500"
      [class.flex-1]="!wrap()"
      [class.flex-auto]="wrap()"
      [class.rounded-md]="wrap()"
      [class.border]="wrap()"
      [class.border-slate-300]="wrap() && !isSelected(option.value)"
      [class.dark:border-slate-600]="wrap() && !isSelected(option.value)"
      [class.border-emerald-500]="wrap() && isSelected(option.value)"
      [class.bg-emerald-500]="isSelected(option.value)"
      [class.text-white]="isSelected(option.value)"
      [class.text-slate-600]="!isSelected(option.value)"
      [class.dark:text-slate-300]="!isSelected(option.value)"
      [class.hover:bg-slate-100]="!isSelected(option.value)"
      [class.dark:hover:bg-slate-800]="!isSelected(option.value)"
      (click)="select(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>

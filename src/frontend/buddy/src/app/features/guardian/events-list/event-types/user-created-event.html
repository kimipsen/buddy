<p class="text-xs font-semibold uppercase tracking-wide text-slate-400">{{ 'events.types.userCreated.title' | translate }}</p>
<p class="mt-1 text-sm font-medium">
  {{
    'events.types.userCreated.description'
      | translate
        : { name: data().name.givenName + ' ' + data().name.familyName, email: data().email.value }
  }}
</p>
<p class="mt-1 text-xs text-slate-500 dark:text-slate-400">{{ data().occurredAt | userDate: 'medium' }}</p>

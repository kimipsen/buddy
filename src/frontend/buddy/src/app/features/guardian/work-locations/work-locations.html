<section class="mx-auto max-w-7xl px-6 py-8 sm:px-8">
  <a
    routerLink="/guardian"
    class="mb-4 inline-flex items-center gap-1 text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-slate-950 dark:hover:text-slate-100"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      class="size-4"
      aria-hidden="true"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
    </svg>
    {{ 'workLocations.backLink' | translate }}
  </a>

  <div class="mb-8">
    <p
      class="text-sm font-medium uppercase tracking-[0.16em] text-emerald-700 dark:text-emerald-400"
    >
      {{ 'workLocations.eyebrow' | translate }}
    </p>
    <h2 class="mt-2 text-3xl font-semibold tracking-normal">
      {{ 'workLocations.title' | translate }}
    </h2>
    <p class="mt-2 max-w-2xl text-sm text-slate-600 dark:text-slate-400">
      {{ 'workLocations.intro' | translate }}
    </p>
  </div>

  @if (loading()) {
    <app-loading-spinner [label]="'workLocations.loading' | translate" />
  } @else if (error(); as message) {
    <p class="text-sm text-red-600 dark:text-red-400" role="alert">{{ message | translate }}</p>
  } @else if (schedule(); as current) {
    <div class="space-y-6">
      <app-manage-work-locations class="block" [schedule]="current" (changed)="load()" />
      <app-work-pattern-editor class="block" [schedule]="current" (changed)="load()" />
      <app-work-day-overrides class="block" [schedule]="current" />
    </div>
  }
</section>

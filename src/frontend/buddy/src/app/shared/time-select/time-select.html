<div class="flex items-center gap-1">
  <select
    class="rounded-lg border border-slate-300 dark:border-slate-600 px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 dark:bg-slate-800 dark:text-slate-100"
    [ngModel]="hour()"
    (ngModelChange)="setHour($event)"
  >
    <option [ngValue]="null" disabled>--</option>
    @for (hourOption of hourOptions(); track hourOption) {
      <option [ngValue]="hourOption">{{ is24Hour() ? pad2(hourOption) : hourOption }}</option>
    }
  </select>
  <span class="text-slate-400">:</span>
  <select
    class="rounded-lg border border-slate-300 dark:border-slate-600 px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 dark:bg-slate-800 dark:text-slate-100"
    [ngModel]="minute()"
    (ngModelChange)="setMinute($event)"
  >
    <option [ngValue]="null" disabled>--</option>
    @for (minuteOption of minuteOptions; track minuteOption) {
      <option [ngValue]="minuteOption">{{ pad2(minuteOption) }}</option>
    }
  </select>
  @if (!is24Hour()) {
    <select
      class="rounded-lg border border-slate-300 dark:border-slate-600 px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 dark:bg-slate-800 dark:text-slate-100"
      [ngModel]="period()"
      (ngModelChange)="setPeriod($event)"
    >
      <option value="AM">AM</option>
      <option value="PM">PM</option>
    </select>
  }
</div>

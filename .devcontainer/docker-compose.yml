services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - ../..:/workspaces:cached

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Ensure services start in the dev network and depend on DB + Mailpit.
    depends_on:
      - db
      - mailpit
    networks:
      - buddy_network
    # Provide credentials and mail connection info to the app from the shared .env
    env_file:
      - .env
    environment:
      MAIL__HOST: mailpit
      MAIL__PORT: "1025"
      MAIL__USERNAME: ${MAILPIT_USERNAME}
      MAIL__PASSWORD: ${MAILPIT_PASSWORD}
    
    # Uncomment to connect as root instead. More info: https://aka.ms/dev-containers-non-root.
    # user: root

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally. 
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  db:
    image: postgres:18
    restart: unless-stopped
    # Headroom only: the API is bounded by its single shared pool (all Marten stores,
    # Maximum Pool Size 50, see src/backend/buddy/Common/Postgres/PostgresDataSource.cs),
    # but Keycloak, psql, the db:marten:* tasks and a second API/test host share this server.
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      # PostgreSQL 18+ images store data in a major-version subdirectory, so the
      # mount belongs at /var/lib/postgresql, not /var/lib/postgresql/data.
      - postgres-data:/var/lib/postgresql
      # Runs once against an empty data directory: creates the separate
      # "keycloak" database (and a dedicated role, if KC_DB_USERNAME differs
      # from POSTGRES_USER) the keycloak service below expects.
      - ./postgres/init-keycloak-db.sh:/docker-entrypoint-initdb.d/init-keycloak-db.sh
    # Credentials live in .devcontainer/.env (gitignored). See .env.example.
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - buddy_network

  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    restart: unless-stopped
    # Credentials live in .devcontainer/.env (gitignored). See .env.example.
    env_file:
      - .env
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      # Disable theme caching so edits under themes/buddy show up without a restart.
      KC_SPI_THEME_STATIC_MAX_AGE: "-1"
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
    # --import-realm loads any *.json realm export placed in data/import on
    # first boot (skipped if the realm already exists) -- see
    # keycloak/buddy-realm.json for the realm/clients/users this provisions.
    command: start-dev --import-realm
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 9080:8080
    volumes:
      - ../themes/buddy:/opt/keycloak/themes/buddy
      - ./keycloak:/opt/keycloak/data/import
    healthcheck:
      # The Keycloak image ships no curl/wget; a bare TCP connect is enough to
      # know the server has finished starting (realm import happens before it
      # binds the port), matching the wait strategy BuddyApiFixture.cs uses.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - buddy_network

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    # Mailpit settings can be controlled via .env (optional).
    env_file:
      - .env
    ports:
      - 2025:1025   # SMTP
      - 9025:8025   # Web UI
    volumes:
        - mailpit-data:/data
    healthcheck:
      # The Mailpit image has no curl, only wget.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8025/api/v1/info || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - buddy_network

volumes:
  postgres-data:
  mailpit-data:

networks:
  buddy_network:
    driver: bridge
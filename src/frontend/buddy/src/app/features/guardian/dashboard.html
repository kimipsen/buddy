<app-page>
  <div class="mb-8 flex flex-wrap items-end justify-between gap-4">
    <div>
      <p
        class="text-sm font-medium uppercase tracking-[0.16em] text-emerald-700 dark:text-emerald-400"
      >
        {{ 'dashboard.eyebrow' | translate }}
      </p>
      <h2 class="mt-2 text-3xl font-semibold tracking-normal">
        {{ 'dashboard.greeting' | translate }}
      </h2>
    </div>
    @if (features.enabled('printing')) {
      <a
        routerLink="/guardian/print"
        class="rounded-lg border border-slate-300 dark:border-slate-600 px-3 py-2 text-sm font-semibold text-slate-700 dark:text-slate-300 transition hover:border-slate-400 dark:hover:border-slate-500"
      >
        {{ 'shell.menu.print' | translate }}
      </a>
    }
  </div>

  <!--
    The resume banner spans the page above the cards. The cards are packed into CSS columns (one,
    two from lg, three from 2xl), so a short card leaves no gap beside a tall one. The DOM order,
    and so the reading and tab order, runs down the first column, then the next.
  -->
  <app-onboarding-resume-card class="contents" />
  <div class="columns-1 gap-6 lg:columns-2 2xl:columns-3">
    @if (features.enabled('mealplans')) {
      <app-mealplan-today class="mb-6 block break-inside-avoid" />
    }
    <app-tasks-today class="mb-6 block break-inside-avoid" />
    <app-events-today class="mb-6 block break-inside-avoid" />
    @if (features.enabled('medicines')) {
      <app-doses-today class="mb-6 block break-inside-avoid" />
    }
    @if (features.enabled('pickups')) {
      <app-pickup-today class="mb-6 block break-inside-avoid" />
    }
    <app-children-overview class="block break-inside-avoid" />
  </div>
</app-page>

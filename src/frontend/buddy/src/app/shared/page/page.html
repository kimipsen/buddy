<section
  class="mx-auto px-4 py-8 sm:px-6 lg:px-8"
  [class.max-w-3xl]="width() === '3xl'"
  [class.max-w-4xl]="width() === '4xl'"
  [class.max-w-5xl]="width() === '5xl'"
  [class.max-w-7xl]="width() === '7xl'"
>
  @if (backLink(); as link) {
    <a
      [routerLink]="link"
      class="mb-4 inline-flex items-center gap-1 text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-slate-950 dark:hover:text-slate-100"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        class="size-4"
        aria-hidden="true"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
      </svg>
      {{ backLabel() }}
    </a>
  }

  <ng-content />
</section>

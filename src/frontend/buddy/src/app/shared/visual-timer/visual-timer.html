@if (!showsBar()) {
  <div
    role="timer"
    class="flex items-center gap-2"
    [class.flex-col]="large()"
    [class.gap-4]="large()"
    [attr.aria-label]="label()"
    [attr.data-phase]="phase()"
  >
    <svg
      aria-hidden="true"
      viewBox="0 0 100 100"
      class="shrink-0"
      [style.width]="scaledSize()"
      [style.height]="scaledSize()"
    >
      <circle
        class="fill-slate-200 dark:fill-slate-700"
        [attr.cx]="center"
        [attr.cy]="center"
        [attr.r]="radius"
      />
      @if (isFull()) {
        <circle
          class="stroke-slate-500 dark:stroke-slate-300"
          stroke-width="2"
          vector-effect="non-scaling-stroke"
          [attr.cx]="center"
          [attr.cy]="center"
          [attr.r]="radius"
          [attr.fill]="fill()"
        />
      } @else if (wedgePath()) {
        <path
          class="stroke-slate-500 dark:stroke-slate-300"
          stroke-width="2"
          stroke-linejoin="round"
          vector-effect="non-scaling-stroke"
          [attr.d]="wedgePath()"
          [attr.fill]="fill()"
        />
      }
      <circle
        class="fill-none stroke-slate-400 dark:stroke-slate-500"
        stroke-width="1"
        vector-effect="non-scaling-stroke"
        [attr.cx]="center"
        [attr.cy]="center"
        [attr.r]="radius"
      />
    </svg>
    @if (visibleLabel()) {
      <span
        aria-hidden="true"
        class="font-semibold text-slate-600 dark:text-slate-300"
        [class.text-sm]="!large()"
        [class.text-2xl]="large()"
        [class.text-center]="large()"
        >{{ visibleLabel() }}</span
      >
    }
    @if (announce()) {
      <span class="sr-only" aria-live="polite">{{ announcement() }}</span>
    }
  </div>
} @else {
  <div
    role="timer"
    class="space-y-1"
    [class.flex]="large()"
    [class.flex-col]="large()"
    [class.items-center]="large()"
    [class.space-y-4]="large()"
    [attr.aria-label]="label()"
    [attr.data-phase]="phase()"
  >
    <!-- A big bar keeps the width the page gives a big disc, so the child's size choice shows. -->
    <div
      aria-hidden="true"
      data-testid="timer-bar"
      class="w-full overflow-hidden rounded-full bg-slate-200 ring-1 ring-slate-400 dark:bg-slate-700 dark:ring-slate-500"
      [class.h-3]="!large()"
      [class.h-12]="large()"
      [class.max-w-full]="large()"
      [style.width]="large() ? scaledSize() : null"
    >
      <div
        class="h-full rounded-full"
        [style.width.%]="percent()"
        [style.background-color]="fill()"
      ></div>
    </div>
    @if (visibleLabel()) {
      <span
        aria-hidden="true"
        class="block font-semibold text-slate-600 dark:text-slate-300"
        [class.text-sm]="!large()"
        [class.text-2xl]="large()"
        [class.text-center]="large()"
        >{{ visibleLabel() }}</span
      >
    }
    @if (announce()) {
      <span class="sr-only" aria-live="polite">{{ announcement() }}</span>
    }
  </div>
}

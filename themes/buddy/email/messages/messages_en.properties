# Restyles the inherited (base theme) *BodyHtml messages so the call-to-action
# link renders as a branded button matching the login theme's primary button,
# instead of the base theme's plain inline <a> link. Wording and placeholder
# order are kept identical to the base theme (see keycloak-themes jar,
# theme/base/email/messages/messages_en.properties) so behavior is unchanged.
emailVerificationBodyHtml=<p>Someone has created a {2} account with this email address. If this was you, click the button below to verify your email address.</p><p style="text-align\:center; margin\:24px 0;"><a href="{0}" style="display\:inline-block; background-color\:#020617; color\:#ffffff; text-decoration\:none; font-weight\:600; font-size\:14px; padding\:12px 28px; border-radius\:8px;">Verify email</a></p><p>This link will expire within {3}.</p><p>If you didn''t create this account, just ignore this message.</p>
passwordResetBodyHtml=<p>Someone just requested to change your {2} account''s credentials. If this was you, click the button below to reset them.</p><p style="text-align\:center; margin\:24px 0;"><a href="{0}" style="display\:inline-block; background-color\:#020617; color\:#ffffff; text-decoration\:none; font-weight\:600; font-size\:14px; padding\:12px 28px; border-radius\:8px;">Reset password</a></p><p>This link will expire within {3}.</p><p>If you don''t want to reset your credentials, just ignore this message and nothing will be changed.</p>
executeActionsBodyHtml=<p>Your administrator has just requested that you update your {2} account by performing the following action(s)\: {3}. Click the button below to start this process.</p><p style="text-align\:center; margin\:24px 0;"><a href="{0}" style="display\:inline-block; background-color\:#020617; color\:#ffffff; text-decoration\:none; font-weight\:600; font-size\:14px; padding\:12px 28px; border-radius\:8px;">Update account</a></p><p>This link will expire within {4}.</p><p>If you are unaware that your administrator has requested this, just ignore this message and nothing will be changed.</p>
identityProviderLinkBodyHtml=<p>Someone wants to link your <b>{1}</b> account with <b>{0}</b> account of user {2}. If this was you, click the button below to link accounts.</p><p style="text-align\:center; margin\:24px 0;"><a href="{3}" style="display\:inline-block; background-color\:#020617; color\:#ffffff; text-decoration\:none; font-weight\:600; font-size\:14px; padding\:12px 28px; border-radius\:8px;">Link account</a></p><p>This link will expire within {5}.</p><p>If you don''t want to link account, just ignore this message. If you link accounts, you will be able to login to {1} through {0}.</p>

<div class="relative">
  <input
    type="text"
    class="w-full min-w-[9rem] rounded-lg border border-slate-300 dark:border-slate-600 py-1.5 pl-2 pr-6 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 disabled:opacity-50 dark:bg-slate-800 dark:text-slate-100"
    [placeholder]="'mealplan.picker.notPlanned' | translate"
    autocomplete="off"
    [value]="displayValue()"
    [disabled]="disabled()"
    (focus)="openDropdown()"
    (input)="onQueryInput($event)"
    (keydown.escape)="closeDropdown()"
    (keydown.enter)="selectFirstMatch()"
  />

  @if (open()) {
    <div class="fixed inset-0 z-10" (click)="closeDropdown()"></div>

    <ul
      class="z-20 max-h-56 min-w-[12rem] overflow-y-auto rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 py-1 shadow-lg"
      [style]="dropdownStyle()"
    >
      <li>
        <button
          type="button"
          class="block w-full px-3 py-1.5 text-left text-sm text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800"
          (click)="selectMeal(null)"
        >
          {{ 'mealplan.picker.notPlanned' | translate }}
        </button>
      </li>

      @for (meal of filteredMeals(); track meal.id) {
        <li>
          <button
            type="button"
            class="flex w-full items-center gap-2 px-3 py-1.5 text-left text-sm hover:bg-slate-100 dark:hover:bg-slate-800"
            (click)="selectMeal(meal)"
          >
            <span class="text-base leading-none">{{ meal.icon }}</span>
            {{ meal.name }}
          </button>
        </li>
      }

      @if (filteredMeals().length === 0) {
        <li class="px-3 py-1.5 text-sm text-slate-400">{{ 'mealplan.picker.noMatches' | translate }}</li>
      }
    </ul>
  }
</div>

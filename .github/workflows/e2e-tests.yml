name: Frontend e2e tests

on:
  pull_request:
    paths:
      - "src/frontend/**"
      - "src/backend/**"
      - "src/load-tests/**"
      - ".devcontainer/docker-compose.yml"
      - ".devcontainer/keycloak/**"
      - ".devcontainer/postgres/**"
      - ".github/workflows/e2e-tests.yml"
  push:
    branches: [master]
    paths:
      - "src/frontend/**"
      - "src/backend/**"
      - "src/load-tests/**"
      - ".devcontainer/docker-compose.yml"
      - ".devcontainer/keycloak/**"
      - ".devcontainer/postgres/**"
      - ".github/workflows/e2e-tests.yml"

# Least privilege for the GITHUB_TOKEN; a job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same SDK as the devcontainer, pinned in global.json at the repo root.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The Node version comes from .nvmrc, the same file the frontend Dockerfile and devcontainer follow.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/frontend/buddy/.nvmrc
          cache: "npm"
          cache-dependency-path: src/frontend/buddy/package-lock.json

      # Ephemeral, CI-only credentials -- matches the ConnectionStrings__Postgres and
      # Authentication__* overrides in playwright.config.ts's ciBackendEnv.
      - name: Write devcontainer .env
        run: |
          cat > .devcontainer/.env <<'EOF'
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=postgres
          KEYCLOAK_ADMIN=admin
          KEYCLOAK_ADMIN_PASSWORD=admin
          KC_DB_USERNAME=postgres
          KC_DB_PASSWORD=postgres
          MAILPIT_ENABLE_AUTH=false
          MAILPIT_USERNAME=mailpit
          MAILPIT_PASSWORD=mailpit
          EOF

      # Testcontainers needs a Docker daemon, which the ubuntu-latest runner provides natively --
      # same as backend-tests.yml's integration suite.
      # The devcontainer reaches Postgres as "db" on the compose network, so the checked-in compose
      # file publishes no port for it. The API here runs on the bare runner and connects to
      # localhost:5432 (ciBackendEnv in playwright.config.ts), so publish it for CI only.
      - name: Publish Postgres for the runner
        run: |
          cat > .devcontainer/docker-compose.ci.yml <<'EOF'
          services:
            db:
              ports:
                - 5432:5432
          EOF

      # mealie: the family's Mealie for mealie-integration.spec.ts (published on localhost:9925, the port `task dev:mealie` uses too).
      - name: Start db, Keycloak, Mailpit and Mealie
        run: docker compose -f .devcontainer/docker-compose.yml -f .devcontainer/docker-compose.ci.yml up -d --wait db keycloak mailpit mealie

      - name: Install frontend dependencies
        working-directory: src/frontend/buddy
        run: npm ci

      - name: Install Playwright browsers
        working-directory: src/frontend/buddy
        run: npx playwright install --with-deps chromium

      # playwright.config.ts's webServer array starts both the API (dotnet run, pointed at the
      # compose services above via CI-only host overrides) and the Angular dev server.
      - name: Run Playwright tests
        working-directory: src/frontend/buddy
        run: npx playwright test
        env:
          CI: "true"

      # k6 smoke (docs/backend/analysis/load-testing-k6.md, "CI"): catches a load script that no
      # longer matches the API, at almost no cost. Real load numbers come from load-tests.yml.
      - name: Type-check the k6 scripts
        working-directory: src/load-tests
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit -p tsconfig.json

      # Playwright stopped its API, so start one again with the same CI overrides (ciBackendEnv in
      # playwright.config.ts) and wait until it's ready.
      - name: Start the API for the k6 smoke run
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
          Authentication__Keycloak__Authority: http://localhost:9080/realms/buddy
          Authentication__Keycloak__ValidIssuer: http://localhost:9080/realms/buddy
          Authentication__KeycloakAdmin__TokenEndpoint: http://localhost:9080/realms/buddy/protocol/openid-connect/token
          Authentication__KeycloakAdmin__AdminBaseUrl: http://localhost:9080/admin/realms/buddy
          Authentication__KeycloakAdmin__ClientSecret: buddy-admin-cli-dev-secret
          Mail__Host: localhost
          Mail__Port: "2025"
        run: |
          nohup dotnet run --project src/backend/buddy > api.log 2>&1 &
          timeout 180 bash -c 'until curl -sf http://localhost:5193/health/ready >/dev/null; do sleep 2; done'

      - name: k6 smoke
        env:
          TARGET: dev
          BASE_URL: http://localhost:5193
          KEYCLOAK_URL: http://localhost:9080
        run: src/load-tests/run.sh

      - name: API log (k6 smoke)
        if: ${{ failure() }}
        run: tail -n 300 api.log || true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: src/frontend/buddy/playwright-report/
          retention-days: 14

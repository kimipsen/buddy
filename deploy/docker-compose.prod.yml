# Production stack for the Oracle VM. Run via `task deploy` (which runs
# deploy/preflight.sh first and sets BUDDY_IMAGE_TAG to the git SHA), see
# deploy/README.md. Run from deploy/, the compose project name is "deploy", so
# named volumes are deploy_postgres-data, deploy_caddy-data, deploy_caddy-config.
#
# Built images are tagged buddy-{api,frontend,keycloak}:${BUDDY_IMAGE_TAG}
# (default "latest" for a manual `docker compose up`), so earlier builds stay
# on the host and a rollback can start them again with --no-build.
#
# `task deploy` also sets BUDDY_VERSION/BUDDY_COMMIT from deploy/version.sh (git
# tags, see docs/versioning.md); the api reports them at GET /version.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - buddy_network
    depends_on:
      - api
      - keycloak
      - frontend

  frontend:
    image: buddy-frontend:${BUDDY_IMAGE_TAG:-latest}
    build:
      context: ../src/frontend/buddy
      args:
        API_BASE_URL: "https://${API_DOMAIN}"
        KEYCLOAK_AUTHORITY: "https://${AUTH_DOMAIN}"
        BUDDY_VERSION: "${BUDDY_VERSION:-0.0.0-dev}"
    restart: unless-stopped
    networks:
      - buddy_network

  api:
    image: buddy-api:${BUDDY_IMAGE_TAG:-latest}
    build:
      context: ../src/backend
      dockerfile: buddy/Dockerfile
      args:
        BUDDY_VERSION: "${BUDDY_VERSION:-0.0.0-dev}"
        BUDDY_COMMIT: "${BUDDY_COMMIT:-unknown}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Authentication__Keycloak__Authority: "http://keycloak:8080/realms/buddy"
      Authentication__Keycloak__ValidIssuer: "https://${AUTH_DOMAIN}/realms/buddy"
      Authentication__Keycloak__Audience: "buddy-api"
      Authentication__Keycloak__RequireHttpsMetadata: "false"
      Authentication__KeycloakAdmin__TokenEndpoint: "http://keycloak:8080/realms/master/protocol/openid-connect/token"
      Authentication__KeycloakAdmin__AdminBaseUrl: "http://keycloak:8080/admin/realms/buddy"
      Authentication__KeycloakAdmin__ClientId: "buddy-admin-cli"
      Authentication__KeycloakAdmin__ClientSecret: "${KEYCLOAK_ADMIN_CLI_SECRET}"
      Cors__AllowedOrigins__0: "https://${APP_DOMAIN}"
      Mail__FrontendBaseUrl: "https://${APP_DOMAIN}"
      # Caddy's X-Forwarded-For is trusted from the private bridge network only. The API publishes no
      # port, so nothing outside buddy_network can reach it to spoof the header. Rate limiting
      # partitions anonymous callers by this address (docs/backend/analysis/rate-limiting.md).
      ForwardedHeaders__KnownNetworks__0: "10.0.0.0/8"
      ForwardedHeaders__KnownNetworks__1: "172.16.0.0/12"
      ForwardedHeaders__KnownNetworks__2: "192.168.0.0/16"
    # The aspnet runtime image has no curl/wget; bash's /dev/tcp does the GET.
    # /health is MapHealthChecks with no registered checks: it says the process
    # is serving requests, not that Postgres/Keycloak are reachable.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - buddy_network

  db:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init-keycloak-db.sql:/docker-entrypoint-initdb.d/init-keycloak-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - buddy_network

  keycloak:
    image: buddy-keycloak:${BUDDY_IMAGE_TAG:-latest}
    # Same image as Azure: stock 21.1.1 + `kc.sh build --db=postgres` + the
    # buddy theme baked in. The stock image is built for dev-file (H2), and
    # `start --optimized` (the image's CMD) doesn't re-run the build, so the
    # stock image would ignore KC_DB=postgres.
    build:
      context: ..
      dockerfile: deploy/azure/keycloak/Dockerfile
      args:
        HEALTH_ENABLED: "true"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: "${AUTH_DOMAIN}"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    # No curl in the Keycloak image either. /health/ready includes the DB check.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - buddy_network

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  buddy_network:
    driver: bridge

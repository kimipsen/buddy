<div class="relative">
  <button
    type="button"
    class="flex h-10 items-center gap-2 rounded-full border border-slate-300 bg-white px-3 pointer-coarse:h-11 text-sm font-semibold text-slate-700 transition hover:border-slate-400 hover:text-slate-950 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-300 dark:hover:border-slate-500 dark:hover:text-slate-100"
    aria-haspopup="true"
    [attr.aria-expanded]="open()"
    #trigger
    (click)="toggle()"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      class="size-5"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5"
      />
    </svg>
    <!-- Icon only on phones, where the header is narrow; the name stays for screen readers. -->
    <span class="max-sm:sr-only">{{ 'shell.nav.button' | translate }}</span>
  </button>

  @if (open()) {
    <!-- Pointer-only dismiss target; keyboard users close with Escape (see onEscape). -->
    <div class="fixed inset-0 z-10" aria-hidden="true" (click)="dismiss()"></div>

    <!-- Height: from the panel's measured top (the header grows when the title wraps) down to
         the bottom of the screen, less the phone tab bar (fixed, about 57px) and the safe area,
         so every item can be scrolled into view above the tab bar. -->
    <nav
      #panel
      class="absolute right-0 z-20 mt-2 max-h-[calc(100dvh-var(--nav-menu-top,5rem)-1rem)] w-64 max-w-[calc(100vw-2rem)] overflow-y-auto overscroll-contain rounded-lg max-sm:max-h-[calc(100dvh-var(--nav-menu-top,5rem)-5rem-env(safe-area-inset-bottom))] border border-slate-200 bg-white py-1 shadow-lg dark:border-slate-800 dark:bg-slate-900"
      [style.--nav-menu-top]="panelTop()"
      [attr.aria-label]="'shell.nav.label' | translate"
    >
      @for (group of groups(); track group.label) {
        <div class="border-slate-200 py-1 not-first:border-t dark:border-slate-800">
          <p
            class="px-4 pb-1 pt-2 text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400"
            [id]="'nav-group-' + $index"
          >
            {{ group.label | translate }}
          </p>
          <ul [attr.aria-labelledby]="'nav-group-' + $index">
            @for (item of group.items; track item.link) {
              <li>
                <!-- Current page: emerald and semibold, plus aria-current (not colour alone). -->
                <a
                  [routerLink]="item.link"
                  routerLinkActive="bg-emerald-50 font-semibold text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300"
                  [routerLinkActiveOptions]="{ exact: !!item.exact }"
                  ariaCurrentWhenActive="page"
                  class="block px-4 py-2 pointer-coarse:py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800"
                  (click)="close()"
                >
                  {{ item.label | translate }}
                </a>
              </li>
            }
          </ul>
        </div>
      }
    </nav>
  }
</div>

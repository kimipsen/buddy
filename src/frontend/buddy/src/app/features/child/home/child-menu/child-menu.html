<div class="relative">
  <button
    type="button"
    class="grid size-12 place-items-center rounded-2xl border-2 border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 transition hover:border-slate-400 dark:hover:border-slate-500 focus:outline-none focus:ring-4 focus:ring-emerald-300"
    aria-haspopup="true"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="size-6">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" />
    </svg>
    <span class="sr-only">{{ 'child.home.menu.openLabel' | translate }}</span>
  </button>

  @if (open()) {
    <div class="fixed inset-0 z-10" (click)="close()" (keydown.escape)="close()"></div>

    <div class="absolute right-0 z-20 mt-2 w-64 overflow-hidden rounded-2xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-3 shadow-lg">
      <p class="mb-1.5 px-1 text-xs font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400">
        {{ 'child.home.theme.label' | translate }}
      </p>
      <div class="grid grid-cols-3 gap-1 rounded-xl bg-slate-100 dark:bg-slate-800 p-1">
        @for (mode of themeModes; track mode) {
          <button
            type="button"
            class="rounded-lg px-2 py-2 text-sm font-semibold text-slate-600 dark:text-slate-400 transition hover:text-slate-950 dark:hover:text-slate-100"
            [class.bg-white]="theme.mode() === mode"
            [class.text-slate-950]="theme.mode() === mode"
            [class.shadow-sm]="theme.mode() === mode"
            [class.dark:bg-slate-950]="theme.mode() === mode"
            [class.dark:text-slate-100]="theme.mode() === mode"
            [attr.aria-pressed]="theme.mode() === mode"
            (click)="setTheme(mode)"
          >
            {{ 'child.home.theme.' + mode | translate }}
          </button>
        }
      </div>

      <button
        type="button"
        class="mt-3 block w-full rounded-xl border-2 border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 px-4 py-3 text-base font-semibold text-slate-700 dark:text-slate-300 transition hover:border-slate-400 dark:hover:border-slate-500"
        (click)="logout()"
      >
        {{ 'child.home.signOut' | translate }}
      </button>
    </div>
  }
</div>

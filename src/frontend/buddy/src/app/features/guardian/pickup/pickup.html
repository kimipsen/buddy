<app-page backLink="/guardian" [backLabel]="'pickup.backLink' | translate">
  <div class="mb-8">
    <p
      class="text-sm font-medium uppercase tracking-[0.16em] text-emerald-700 dark:text-emerald-400"
    >
      {{ 'pickup.eyebrow' | translate }}
    </p>
    <h2 class="mt-2 text-3xl font-semibold tracking-normal">{{ 'pickup.title' | translate }}</h2>
    @if (features.enabled('babysitters')) {
      <a
        routerLink="/guardian/babysitters"
        class="mt-2 inline-block text-sm font-semibold text-emerald-700 dark:text-emerald-400 hover:text-emerald-800 dark:hover:text-emerald-300"
        >{{ 'pickup.assign.manageBabysittersLink' | translate }}</a
      >
    }
  </div>

  <div class="space-y-6">
    <app-manage-pickups class="block" />
  </div>
</app-page>

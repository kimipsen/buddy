<app-page backLink="/guardian" [backLabel]="'workLocations.backLink' | translate">
  <div class="mb-8">
    <p
      class="text-sm font-medium uppercase tracking-[0.16em] text-emerald-700 dark:text-emerald-400"
    >
      {{ 'workLocations.eyebrow' | translate }}
    </p>
    <h2 class="mt-2 text-3xl font-semibold tracking-normal">
      {{ 'workLocations.title' | translate }}
    </h2>
    <p class="mt-2 max-w-2xl text-sm text-slate-600 dark:text-slate-400">
      {{ 'workLocations.intro' | translate }}
    </p>
  </div>

  @if (schedule.hasValue()) {
    @let current = schedule.value();
    <div class="space-y-6">
      <app-manage-work-locations class="block" [schedule]="current" (changed)="reload()" />
      <app-work-pattern-editor class="block" [schedule]="current" (changed)="reload()" />
      <app-work-day-overrides class="block" [schedule]="current" />
    </div>
  } @else if (schedule.error()) {
    <p class="text-sm text-red-600 dark:text-red-400" role="alert">
      {{ 'workLocations.loadError' | translate }}
    </p>
  } @else {
    <app-loading-spinner [label]="'workLocations.loading' | translate" />
  }
</app-page>

<app-page backLink="/guardian" [backLabel]="'progress.backLink' | translate">
  <div class="mb-8">
    <p
      class="text-sm font-medium uppercase tracking-[0.16em] text-emerald-700 dark:text-emerald-400"
    >
      {{ 'progress.eyebrow' | translate }}
    </p>
    <h2 class="mt-2 text-3xl font-semibold tracking-normal">{{ 'progress.title' | translate }}</h2>
  </div>

  <div class="space-y-6">
    <!-- Rewards first: requests waiting for an answer are the thing to act on. -->
    <app-manage-rewards class="block" />
    <app-manage-progress-goals class="block" />
  </div>
</app-page>

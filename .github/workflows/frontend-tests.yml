name: Frontend tests

on:
  pull_request:
    branches: [master]
    paths:
      - "src/frontend/**"
      - ".claude/skills/i18n/**"
      - ".github/workflows/frontend-tests.yml"
      - ".github/scripts/coverage-report.sh"
  push:
    branches: [master]
    paths:
      - "src/frontend/**"
      - ".claude/skills/i18n/**"
      - ".github/workflows/frontend-tests.yml"
      - ".github/scripts/coverage-report.sh"

# Least privilege for the GITHUB_TOKEN; a job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Writes the coverage comment on the pull request.
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: src/frontend/buddy
    steps:
      - uses: actions/checkout@v7

      # The Node version comes from .nvmrc, the same file the frontend Dockerfile and devcontainer follow.
      - uses: actions/setup-node@v7
        with:
          node-version-file: src/frontend/buddy/.nvmrc
          cache: "npm"
          cache-dependency-path: src/frontend/buddy/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The app type check also enforces exact en/da key parity (translations/index.ts).
      - name: Type check app
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Type check specs
        run: npx tsc --noEmit -p tsconfig.spec.json

      # ESLint (angular-eslint, flat config in eslint.config.js); warnings don't fail the build.
      - name: Lint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      # Coverage via @vitest/coverage-v8, written to coverage/buddy.
      - name: Unit tests
        run: >-
          npm test -- --watch=false --coverage
          --coverage-reporters=cobertura --coverage-reporters=html --coverage-reporters=text-summary

      - name: Coverage report
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number || '' }}
        run: .github/scripts/coverage-report.sh Frontend src/frontend/buddy/coverage/buddy/cobertura-coverage.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: src/frontend/buddy/coverage/buddy
          retention-days: 14

      # Fails on missing keys or {placeholder} mismatches between en and da; identical-text
      # entries are reported as warnings.
      - name: i18n parity
        run: node ../../../.claude/skills/i18n/check-parity.mjs

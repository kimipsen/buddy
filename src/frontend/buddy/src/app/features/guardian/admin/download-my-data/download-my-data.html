<app-card>
  <h3 class="mb-2 text-lg font-semibold tracking-normal">
    {{ 'admin.downloadData.title' | translate }}
  </h3>
  <p class="mb-4 text-sm leading-6 text-slate-500 dark:text-slate-400">
    {{ 'admin.downloadData.description' | translate }}
  </p>

  <button
    type="button"
    class="rounded-lg bg-slate-950 px-4 py-2 text-sm font-semibold text-white transition hover:bg-slate-800 disabled:opacity-50 dark:bg-emerald-600 dark:hover:bg-emerald-500"
    [disabled]="downloading.busy()"
    (click)="download()"
  >
    {{
      (downloading.busy() ? 'admin.downloadData.downloadingButton' : 'admin.downloadData.button')
        | translate
    }}
  </button>

  @if (downloading.state(); as state) {
    @if (state.status === 'error') {
      <p class="mt-3 text-sm text-red-600 dark:text-red-400">{{ state.message | translate }}</p>
    }
  }
</app-card>

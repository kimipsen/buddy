# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  GREETING: Hello, world!

tasks:
  hooks:install:
    desc: 'Install the git hooks (pre-commit format/lint checks, plus the AI documentation sync). Usage: task hooks:install AGENT=claude|codex|copilot|none'
    vars:
      RESOLVED_AGENT: '{{.AGENT | default "claude"}}'
    preconditions:
      - sh: 'case "{{.RESOLVED_AGENT}}" in claude|codex|copilot|none) exit 0 ;; *) exit 1 ;; esac'
        msg: 'AGENT must be one of: claude, codex, copilot, none (got "{{.RESOLVED_AGENT}}")'
    cmds:
      - git config core.hooksPath .devcontainer/git-hooks
      - |
        if [ "{{.RESOLVED_AGENT}}" = "none" ]; then
          git config --unset hooks.doc-agent || true
        else
          git config hooks.doc-agent "{{.RESOLVED_AGENT}}"
          if ! command -v "{{.RESOLVED_AGENT}}" >/dev/null 2>&1; then
            echo "Warning: '{{.RESOLVED_AGENT}}' was not found on PATH — install/authenticate it before committing." >&2
          fi
        fi
      - echo "Installed git hooks (core.hooksPath=.devcontainer/git-hooks, doc-agent={{.RESOLVED_AGENT}})."

  hooks:uninstall:
    desc: Remove the git hook configuration (pre-commit checks and documentation sync)
    cmds:
      - git config --unset core.hooksPath || true
      - git config --unset hooks.doc-agent || true
      - echo "Removed git hook configuration."

  test:
    desc: Run all tests (backend, then frontend)
    cmds:
      - task: test:backend
      - task: test:frontend

  test:backend:
    desc: Run backend tests
    dir: src/backend
    cmds:
      - dotnet test backend.slnx

  test:frontend:
    desc: Run frontend tests
    dir: src/frontend/buddy
    cmds:
      - npm test

  test:e2e:frontend:report:
    dir: src/frontend/buddy
    cmds:
      - npx playwright show-report

  test:e2e:
    desc: Run all e2e tests (frontend only, for now)
    cmds:
      - task: test:e2e:frontend

  test:e2e:frontend:
    desc: >-
      Run frontend e2e tests (Playwright). Needs Postgres, Keycloak, and
      Mailpit running (already true in the devcontainer); starts the API and
      Angular dev server itself. Run "npx playwright install --with-deps
      chromium" once per machine first.
    dir: src/frontend/buddy
    cmds:
      - npm run test:e2e

  docs:screenshots:
    desc: >-
      Regenerate the page screenshots in docs/screenshots (and its README.md).
      Seeds a fresh demo family (guardian demo.sara, child demo.emil) through
      the API, then captures every page listed in
      src/frontend/buddy/screenshots/pages.ts. Needs Postgres, Keycloak, and
      Mailpit running (already true in the devcontainer); starts the API and
      Angular dev server itself, or reuses them if they're already running.
    dir: src/frontend/buddy
    cmds:
      - npm run screenshots

  test:mutation:
    desc: Run all mutation tests (backend, then frontend)
    cmds:
      - task: test:mutation:backend
      - task: test:mutation:frontend

  test:mutation:backend:
    desc: >-
      Run backend mutation tests (dotnet-stryker). Fails if Stryker didn't
      test any mutants (no tests discovered, initial test run failed), which
      Stryker itself can report with exit code 0.
    dir: src/backend/buddy.IntegrationTests
    cmds:
      - dotnet tool restore
      - ./run-stryker.sh {{.CLI_ARGS}}

  test:mutation:frontend:
    desc: Run frontend mutation tests (Stryker)
    dir: src/frontend/buddy
    cmds:
      - npm run test:mutation

  test:mutation:frontend:batch:
    desc: >-
      Work through frontend mutation testing a few files at a time (see
      scripts/mutation-batch.sh), so it doesn't overwhelm the devcontainer.
      Re-run repeatedly to cover the whole codebase; results accumulate in
      reports/stryker-incremental.json as a baseline. Usage: task
      test:mutation:frontend:batch [BATCH_SIZE=5] [CONCURRENCY=2] [--
      --status|--reset|--dry-run]
    dir: src/frontend/buddy
    vars:
      BATCH_SIZE: '{{.BATCH_SIZE | default "5"}}'
      CONCURRENCY: '{{.CONCURRENCY | default "2"}}'
    cmds:
      - ./scripts/mutation-batch.sh --batch-size {{.BATCH_SIZE}} --concurrency
        {{.CONCURRENCY}} {{.CLI_ARGS}}

  test:mutation:frontend:changed:
    desc: >-
      Run frontend mutation tests only on files changed since a base commit
      (default: origin/master), reusing reports/stryker-incremental.json as a
      baseline if one exists. Usage: task test:mutation:frontend:changed
      [BASE=origin/master] [CONCURRENCY=1]
    dir: src/frontend/buddy
    vars:
      BASE: '{{.BASE | default "origin/master"}}'
      CONCURRENCY: '{{.CONCURRENCY | default "1"}}'
    cmds:
      - >-
        git fetch origin --quiet || echo "Warning: could not fetch origin,
        diffing against the local ref for {{.BASE}}" >&2
      - |
        FILES=$(git diff --name-only --diff-filter=ACM "{{.BASE}}"...HEAD -- 'src/app/**/*.ts' | grep -v '\.spec\.ts$' | paste -sd, -)
        if [ -z "$FILES" ]; then
          echo "No changed frontend source files since {{.BASE}}."
          exit 0
        fi
        echo "Mutating files changed since {{.BASE}}:"
        echo "$FILES" | tr ',' '\n' | sed 's/^/  /'
        npx stryker run --mutate "$FILES" --incremental --concurrency {{.CONCURRENCY}}

  deploy:
    desc: Build and (re)start the production stack (deploy/docker-compose.prod.yml) - on the Oracle VM only
    dir: deploy
    preconditions:
      - sh: test -f .env
        msg: "deploy/.env not found — copy deploy/.env.example to deploy/.env and fill in real values first."
    cmds:
      # Refuses inside a container (devcontainer/Codespaces) and unless DEPLOY_HOST in .env matches `hostname`.
      - ./preflight.sh
      # Images are tagged with the commit (plus -dirty for uncommitted changes) so a rollback can reuse them; see deploy/README.md "Rollback".
      - |
        set -e
        BUDDY_IMAGE_TAG="$(git rev-parse --short=12 HEAD)$(git diff --quiet HEAD -- || echo -dirty)"
        BUDDY_VERSION="$(./version.sh)"
        BUDDY_COMMIT="$(./version.sh --commit)"
        export BUDDY_IMAGE_TAG BUDDY_VERSION BUDDY_COMMIT
        echo "Deploying version $BUDDY_VERSION, image tag $BUDDY_IMAGE_TAG"
        docker compose -f docker-compose.prod.yml up -d --build --wait --wait-timeout 600
        # Only reached when every service came up (healthy where it has a healthcheck): :latest = last good deploy.
        for svc in api frontend keycloak; do docker tag "buddy-$svc:$BUDDY_IMAGE_TAG" "buddy-$svc:latest"; done

  deploy:azure:
    desc: Deploy backend + frontend + Keycloak + Postgres to Azure Container Apps (deploy/azure/deploy.sh)
    dir: deploy/azure
    preconditions:
      - sh: test -f .env
        msg: "deploy/azure/.env not found — copy deploy/azure/.env.example to deploy/azure/.env and fill in real values first."
    cmds:
      - ./deploy.sh

  release:
    desc: 'Tag HEAD as a release (annotated vX.Y.Z tag, read by MinVer) and push HEAD + tag to every git remote. Usage: task release VERSION=1.2.0 (or task release -- 1.2.0)'
    vars:
      # Accept "1.2.0" or "v1.2.0"; the tag always gets the "v" prefix.
      VERSION_RAW: '{{.VERSION | default .CLI_ARGS | trim}}'
      TAG: 'v{{trimPrefix "v" .VERSION_RAW}}'
    preconditions:
      - sh: '[ -n "{{.VERSION_RAW}}" ]'
        msg: 'Specify a version: task release VERSION=1.2.0 (or task release -- 1.2.0)'
      - sh: 'echo "{{.TAG}}" | grep -Eq "^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$"'
        msg: '"{{.VERSION_RAW}}" is not a semantic version like 1.2.0 or 1.3.0-rc.1'
      - sh: 'git diff --quiet HEAD -- && [ -z "$(git ls-files --others --exclude-standard)" ]'
        msg: 'Working tree is not clean; commit or stash your changes first.'
      - sh: '! git rev-parse -q --verify "refs/tags/{{.TAG}}" >/dev/null'
        msg: 'Tag {{.TAG}} already exists locally.'
    cmds:
      - |
        set -e
        for remote in $(git remote); do
          if git ls-remote --exit-code --tags "$remote" "refs/tags/{{.TAG}}" >/dev/null 2>&1; then
            echo "Tag {{.TAG}} already exists on $remote." >&2
            exit 1
          fi
        done
        echo "Tagging $(git log -1 --format='%h %s') as {{.TAG}}"
        git tag -a "{{.TAG}}" -m "Release {{trimPrefix "v" .TAG}}"
        # Same as `git pushall {{.TAG}}`: push the current branch and the tag to every remote.
        for remote in $(git remote); do
          echo "Pushing HEAD and {{.TAG}} to $remote"
          git push "$remote" HEAD "refs/tags/{{.TAG}}"
        done

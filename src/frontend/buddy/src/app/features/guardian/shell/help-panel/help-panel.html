<section
  [id]="panelId()"
  [attr.aria-labelledby]="panelId() + '-title'"
  class="rounded-lg border border-emerald-200 bg-emerald-50 p-5 shadow-sm dark:border-emerald-900 dark:bg-emerald-950"
>
  <div class="flex items-start justify-between gap-4">
    <h2
      [id]="panelId() + '-title'"
      class="text-lg font-semibold text-emerald-900 dark:text-emerald-100"
    >
      {{ 'help.panelTitle' | translate: { topic: (titleKey() | translate) } }}
    </h2>
    <button
      type="button"
      class="rounded-lg px-2 py-1 text-sm font-medium text-emerald-800 hover:bg-emerald-100 dark:text-emerald-200 dark:hover:bg-emerald-900"
      (click)="closed.emit()"
    >
      {{ 'help.close' | translate }}
    </button>
  </div>

  <div class="mt-3">
    <app-help-content [topic]="topic()" [headingLevel]="3" />
  </div>

  <div
    class="mt-5 flex flex-wrap items-center gap-x-4 gap-y-2 border-t border-emerald-200 pt-3 text-sm dark:border-emerald-900"
  >
    @if (related().length > 0) {
      <span class="text-emerald-800 dark:text-emerald-200">{{ 'help.related' | translate }}</span>
      @for (item of related(); track item.id) {
        <a
          routerLink="/guardian/help"
          [queryParams]="{ topic: item.id }"
          class="font-medium text-emerald-700 hover:underline dark:text-emerald-400"
        >
          {{ item.titleKey | translate }}
        </a>
      }
    }
    <a
      routerLink="/guardian/help"
      [queryParams]="{ topic: topic().id }"
      class="ml-auto font-semibold text-emerald-700 hover:underline dark:text-emerald-400"
    >
      {{ 'help.allTopics' | translate }}
    </a>
  </div>
</section>

@if (items().length > 0) {
  <!-- A labelled group, not a section with a heading: the periods below are the card's sections. -->
  <div class="mb-4 print:hidden" role="group" aria-labelledby="effect-inclusion-title">
    <p
      id="effect-inclusion-title"
      class="text-xs font-semibold uppercase tracking-wide text-slate-600 dark:text-slate-300"
    >
      {{ 'medicine.effects.inclusion.title' | translate }}
    </p>
    <ul class="mt-1">
      @for (item of items(); track item.medicineId) {
        <li
          class="flex items-center justify-between gap-3 border-t border-slate-100 dark:border-slate-800 py-2 text-sm"
        >
          <span>{{ item.name }}</span>
          <app-toggle
            [checked]="!item.isExcludedFromEffects"
            [disabled]="savingId() !== null"
            [ariaLabel]="'medicine.effects.inclusion.toggle' | translate: { name: item.name }"
            (checkedChange)="setIncluded(item.medicineId, $event)"
          />
        </li>
      }
    </ul>
    <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">
      {{ 'medicine.effects.inclusion.hint' | translate }}
    </p>
    @if (error(); as message) {
      <p class="mt-2 text-sm text-red-600 dark:text-red-400" role="alert">
        {{ message | translate }}
      </p>
    }
  </div>
}

name: Mutation testing

on:
  # Nightly at 02:00 UTC. GitHub may start scheduled runs late, and disables schedules in repos
  # with no activity for 60 days.
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: Which mutation suites to run
        type: choice
        options: [frontend, backend, both]
        default: frontend
      dry_run:
        description: Only list what the findings-issue step would create, edit, reopen or close (in the run summary), without touching any issue
        type: boolean
        default: false

# Least privilege for the GITHUB_TOKEN; a job that needs more asks for it itself.
permissions:
  contents: read

# A slow run must never be cancelled by (or overlap with) the next night's run.
concurrency:
  group: mutation-testing
  cancel-in-progress: false

jobs:
  # Scheduled runs can't take inputs, so they read the MUTATION_SCOPE repository variable instead
  # (Settings -> Secrets and variables -> Actions -> Variables). Unset means frontend only. The
  # backend suite works again (Stryker.NET 5.0.0 + the SDK Roslyn overlay in run-stryker.sh) but
  # an unscoped run takes hours -- set it to "both" once that cost is acceptable nightly.
  setup:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - id: scope
        env:
          SCOPE: ${{ inputs.scope || vars.MUTATION_SCOPE || 'frontend' }}
        run: |
          case "$SCOPE" in
            frontend|backend|both) ;;
            *) echo "::error::Invalid mutation scope '$SCOPE' (expected frontend, backend or both)"; exit 1 ;;
          esac
          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
          echo "Mutation scope: \`$SCOPE\` (${{ github.event_name }})" >> "$GITHUB_STEP_SUMMARY"

  backend:
    needs: setup
    if: needs.setup.outputs.scope != 'frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same SDK as the devcontainer, pinned in global.json at the repo root.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/backend/backend.slnx

      - name: Restore local tools
        working-directory: src/backend
        run: dotnet tool restore

      # Testcontainers needs a Docker daemon, which the ubuntu-latest runner provides natively.
      # This is a slow, thorough check (every mutant reruns the real integration suite against
      # Postgres/Keycloak/mailpit; a full run can take multiple hours) -- see
      # docs/backend/analysis/mutation-testing-strategy.md. To scope a run to one feature, edit
      # the "mutate" array in stryker-config.json rather than passing --mutate here -- Stryker.NET
      # does not honor the CLI flag when the config file also sets "mutate".
      # run-stryker.sh runs the tool with the SDK's Roslyn swapped in (the bundled one can't compile
      # C# preview unions) and fails the step when Stryker tested no mutants (no tests discovered,
      # initial test run failed, mutated build failed, crash) -- Stryker.NET itself can exit 0 then.
      - name: Run Stryker.NET
        working-directory: src/backend/buddy.IntegrationTests
        run: ./run-stryker.sh

      - name: Upload Stryker log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-mutation-log
          path: src/backend/buddy.IntegrationTests/StrykerOutput/stryker-run.log
          if-no-files-found: ignore

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-mutation-report
          path: src/backend/buddy.IntegrationTests/StrykerOutput/**/reports/*.html
          if-no-files-found: ignore

  frontend:
    needs: setup
    if: needs.setup.outputs.scope != 'backend'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: src/frontend/buddy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Node version comes from .nvmrc, the same file the frontend Dockerfile and devcontainer follow.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/frontend/buddy/.nvmrc
          cache: 'npm'
          cache-dependency-path: src/frontend/buddy/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The cache restore below replaces the committed report. Keep a copy: a file whose committed
      # results are at its current fingerprint (e.g. survivors just fixed with /mutation-fix) takes
      # them from here rather than from an older cached run (--baseline below).
      - name: Keep committed mutation report
        run: cp reports/stryker-incremental.json "$RUNNER_TEMP/stryker-committed.json"

      # Restore where the last run got to: the cumulative results and the list of files covered
      # (with a fingerprint of each file and its specs). With no cache (first run, or evicted after
      # 7 days unused) the committed reports/stryker-incremental.json is the starting point and
      # every file is run again.
      - name: Restore mutation progress
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src/frontend/buddy/reports/stryker-incremental.json
            src/frontend/buddy/.mutation-batch-progress
          key: stryker-batches-${{ github.run_id }}
          restore-keys: stryker-batches-

      # A full run doesn't fit in one job, so work through the files in batches until the time
      # budget is used up; the next run carries on from there. Each batch only runs the specs that
      # exercise its files (see scripts/mutation-batch.sh). Once every file is covered, a night only
      # re-runs files whose source or specs changed. The step timeout is a backstop: the script
      # stops itself at --max-minutes, so the steps below still save and report what it finished.
      # timeoutMS in stryker.conf.json keeps one slow test run from cascading into timeouts.
      - name: Run StrykerJS in batches
        timeout-minutes: 250
        run: ./scripts/mutation-batch.sh --rerun-changed --baseline "$RUNNER_TEMP/stryker-committed.json" --max-minutes 230 --batch-size 10 --concurrency "$(nproc)"

      # The batch script slims the report on exit; this repeats it in case anything wrote the
      # report after that, so the cache and the findings issue never carry an unslimmed one.
      - name: Slim mutation report
        if: always()
        run: node scripts/mutation-slim-report.mjs

      - name: Save mutation progress
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src/frontend/buddy/reports/stryker-incremental.json
            src/frontend/buddy/.mutation-batch-progress
          key: stryker-batches-${{ github.run_id }}

      - name: Write summary
        if: ${{ !cancelled() }}
        run: |
          jq -r '
            [.files[].mutants[].status] as $s
            | def n(x): [$s[] | select(. == x)] | length;
            (n("Killed")) as $k | (n("Timeout")) as $t | (n("Survived")) as $sv | (n("NoCoverage")) as $nc
            | ($k + $t + $sv + $nc) as $valid
            | "### Frontend mutation score: \(if $valid > 0 then (($k + $t) * 10000 / $valid | round / 100) else "n/a" end)%\n",
              "| Killed | Survived | Timeout | No coverage | Compile error | Files |",
              "|---|---|---|---|---|---|",
              "| \($k) | \($sv) | \($t) | \($nc) | \(n("CompileError")) | \(.files | length) |"
          ' reports/stryker-incremental.json >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          ./scripts/mutation-batch.sh --rerun-changed --status >> "$GITHUB_STEP_SUMMARY"

      # Only after the batch step succeeded, so a crash never rewrites the issue. Until the first
      # pass over all files is done, the issue lists the findings in the files covered so far.
      # Files whose source or specs changed since their recorded results, and which this run didn't
      # reach, are only named in the issue: their old line numbers and findings no longer apply.
      - name: Build findings list
        run: |
          ./scripts/mutation-batch.sh --stale > reports/mutation-stale.txt
          node scripts/mutation-issue.mjs --stale reports/mutation-stale.txt --out reports/mutation-findings.md --out-dir reports/mutation-issues > reports/mutation-issue.md

      # One rolling issue per group of at most 5 report files (see scripts/mutation-issue.mjs),
      # each rewritten from the default branch: created when its group has surviving/uncovered
      # mutants, edited while it still has them, closed once it has none, reopened if they come
      # back. Branch runs don't touch them. The decisions (which issue belongs to which group)
      # are made by `mutation-issue.mjs --plan-sync`, tested in mutation-issue.test.mjs; this step
      # only executes the plan. Issues without a group marker (the old single issue) are never in
      # the plan. A failing issue doesn't stop the others; the step fails at the end, listing them,
      # and the next night repeats whatever is left. The first run after a full pass can create up
      # to ~80 issues, so creations are capped per run (MAX_CREATES, the rest follows the next
      # nights) and spaced out. Nothing in the repo or the Gas City config reacts to new
      # `mutation-testing` issues (the city only polls pull requests), so they don't start work.
      # Run the workflow by hand with dry_run to see the plan in the summary without touching any
      # issue; do that before the first live run.
      - name: Update findings issue
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LABEL: mutation-testing
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_CREATES: 25
        run: |
          set -euo pipefail
          out_dir=reports/mutation-issues
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT

          gh label create "$LABEL" --color D93F0B --description "Findings from the nightly mutation-testing run" 2>/dev/null || true

          # Open and closed issues with the label, every page, pull requests dropped.
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?labels=$LABEL&state=all&per_page=100" |
            jq -s 'add // [] | map(select(has("pull_request") | not))' > "$work/issues.json"

          if [ "$DRY_RUN" = "true" ]; then
            node scripts/mutation-issue.mjs --plan-sync "$work/issues.json" --out-dir "$out_dir" --dry-run > "$work/plan.txt"
            {
              echo "### Findings issues (dry run, nothing was changed)"
              echo
              echo '```'
              cat "$work/plan.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node scripts/mutation-issue.mjs --plan-sync "$work/issues.json" --out-dir "$out_dir" > "$work/plan.json"

          # Runs a gh command; after a rate-limit error waits a minute and tries once more.
          gh_retry() {
            local err="$work/gh.err"
            if "$@" 2> "$err"; then
              return 0
            fi
            if grep -qiE 'rate limit|abuse' "$err"; then
              echo "Rate limited, retrying in 60s: $*" >&2
              sleep 60
              if "$@" 2> "$err"; then
                return 0
              fi
            fi
            cat "$err" >&2
            return 1
          }

          created=0 edited=0 reopened=0 closed=0 skipped=0 deferred=0
          failures=()
          links=()
          issue_url() { echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues/$1"; }

          while IFS= read -r action; do
            type=$(jq -r '.type' <<< "$action")
            key=$(jq -r '.key' <<< "$action")
            number=$(jq -r '.number // empty' <<< "$action")
            title=$(jq -r '.title // empty' <<< "$action")
            file=$(jq -r '.file // empty' <<< "$action")
            body="$out_dir/$file"
            case "$type" in
              create)
                if [ "$created" -ge "$MAX_CREATES" ]; then
                  deferred=$((deferred + 1))
                  continue
                fi
                if url=$(gh_retry gh issue create --title "$title" --label "$LABEL" --body-file "$body"); then
                  created=$((created + 1))
                  links+=("- created $key: $url")
                else
                  failures+=("create $key")
                fi
                sleep 2
                ;;
              edit)
                if gh_retry gh issue edit "$number" --title "$title" --body-file "$body"; then
                  edited=$((edited + 1))
                  links+=("- edited $key: $(issue_url "$number")")
                else
                  failures+=("edit #$number ($key)")
                fi
                ;;
              reopen+edit)
                if gh_retry gh issue reopen "$number" && gh_retry gh issue edit "$number" --title "$title" --body-file "$body"; then
                  reopened=$((reopened + 1))
                  links+=("- reopened $key: $(issue_url "$number")")
                else
                  failures+=("reopen #$number ($key)")
                fi
                ;;
              close)
                if gh_retry gh issue close "$number" --comment "No surviving or uncovered mutants in this group as of ${GITHUB_SHA::7}."; then
                  closed=$((closed + 1))
                  links+=("- closed $key: $(issue_url "$number")")
                else
                  failures+=("close #$number ($key)")
                fi
                ;;
              skip)
                skipped=$((skipped + 1))
                ;;
              *)
                failures+=("unknown action '$type' for $key")
                ;;
            esac
          done < <(jq -c '.[]' "$work/plan.json")

          {
            echo "### Findings issues"
            echo
            echo "Created $created, edited $edited, reopened $reopened, closed $closed, unchanged $skipped, deferred $deferred (creation cap $MAX_CREATES per run), failed ${#failures[@]}."
            if [ "${#links[@]}" -gt 0 ]; then
              echo
              printf '%s\n' "${links[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${#failures[@]}" -gt 0 ]; then
            printf '::error::Failed: %s\n' "${failures[@]}"
            exit 1
          fi

      # Stryker's own HTML report only shows the last batch; render one from all results.
      - name: Build HTML report
        if: ${{ !cancelled() }}
        run: node scripts/mutation-html.mjs

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-mutation-report
          path: |
            src/frontend/buddy/reports/mutation
            src/frontend/buddy/reports/stryker-incremental.json
            src/frontend/buddy/reports/mutation-findings.md
          if-no-files-found: ignore

parent=keycloak

# Re-declares the inherited stylesheet list so buddy-overrides.css loads after
# it. css/login.css isn't shipped by this theme, so it resolves by falling
# back to the "keycloak" parent theme, keeping all of its PatternFly-based
# layout/grids/icons intact underneath our overrides.
styles=css/login.css css/buddy-overrides.css

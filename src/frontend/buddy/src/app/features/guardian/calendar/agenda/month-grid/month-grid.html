<div class="overflow-x-auto">
  <div class="grid min-w-[42rem] grid-cols-7 gap-px overflow-hidden rounded-lg border border-slate-200 bg-slate-200">
    @for (label of weekdayLabels(); track label) {
      <div class="bg-slate-50 px-2 py-1.5 text-center text-xs font-semibold uppercase tracking-wide text-slate-500">{{ label }}</div>
    }

    @for (week of weeks(); track $index) {
      @for (day of week.days; track day.date) {
        <button
          type="button"
          class="flex min-h-[6rem] flex-col items-stretch gap-1 bg-white p-1.5 text-left transition hover:bg-slate-50"
          [class.bg-slate-50]="!day.isCurrentMonth"
          [class.text-slate-400]="!day.isCurrentMonth"
          (click)="selectDay(day.date)"
        >
          <span
            class="inline-flex size-6 items-center justify-center self-start rounded-full text-xs font-semibold"
            [class.bg-emerald-600]="day.date === today()"
            [class.text-white]="day.date === today()"
          >
            {{ day.label }}
          </span>

          <div class="flex flex-col gap-0.5">
            @for (entry of visibleChips(day.date); track entry.itemId) {
              <span class="flex items-center gap-1 truncate rounded px-1 py-0.5 text-xs" [style.background-color]="entry.color + '22'">
                <span class="inline-block size-1.5 shrink-0 rounded-full" [style.background-color]="entry.color"></span>
                <span class="truncate">{{ titleFor(entry) }}</span>
              </span>
            }
            @if (overflowCount(day.date) > 0) {
              <span class="px-1 text-xs font-medium text-slate-500">
                {{ 'calendar.agenda.monthGrid.moreLabel' | translate: { count: overflowCount(day.date) } }}
              </span>
            }
          </div>
        </button>
      }
    }
  </div>
</div>

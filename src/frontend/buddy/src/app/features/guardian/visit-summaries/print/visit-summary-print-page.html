<div
  class="min-h-dvh bg-slate-100 text-slate-950 dark:bg-slate-950 dark:text-slate-50 print:min-h-0 print:bg-white print:text-black"
>
  <div
    class="flex flex-wrap items-center gap-3 border-b border-slate-200 bg-white px-4 py-3 dark:border-slate-800 dark:bg-slate-900 print:hidden"
  >
    <a
      [routerLink]="['/guardian/visit-summaries', childId, summaryId]"
      class="text-sm font-medium text-slate-600 hover:text-slate-950 dark:text-slate-300 dark:hover:text-slate-100"
      >← {{ 'visitSummaries.page.backToSummary' | translate }}</a
    >
    @if (loaded.hasValue()) {
      <button
        type="button"
        class="ml-auto rounded-lg bg-emerald-600 dark:bg-emerald-500 px-4 py-2 text-sm font-semibold text-white transition hover:bg-emerald-500 dark:hover:bg-emerald-400"
        (click)="print()"
      >
        {{ 'visitSummaries.page.print' | translate }}
      </button>
    }
  </div>

  @if (loaded.isLoading()) {
    <div class="p-8 print:hidden">
      <app-loading-spinner [label]="'visitSummaries.loading' | translate" />
    </div>
  } @else if (loaded.error()) {
    <p class="p-8 text-sm text-red-600 dark:text-red-400">
      {{ 'visitSummaries.loadError' | translate }}
    </p>
  } @else if (loaded.hasValue()) {
    <!-- A4 portrait: 210mm wide on screen; the page's own margins on paper. -->
    <div class="mx-auto my-8 w-full max-w-[210mm] print:my-0 print:max-w-none">
      <app-visit-summary-report [report]="loaded.value().report" />
    </div>
  }
</div>

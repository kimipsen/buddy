version: 2
updates:
  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 6 * * 1,5" # Monday and Friday, 06:00
      timezone: "Europe/Copenhagen"
    groups:
      github-actions:
        patterns:
          - "*"

  # Dev container features
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 6 * * 1,5" # Monday and Friday, 06:00
      timezone: "Europe/Copenhagen"
    groups:
      devcontainer-features:
        patterns:
          - "*"

  # .NET backend (buddy + buddy.IntegrationTests share backend.slnx)
  - package-ecosystem: "nuget"
    directory: "/src/backend"
    schedule:
      interval: "cron"
      cronjob: "0 6 * * 1,5" # Monday and Friday, 06:00
      timezone: "Europe/Copenhagen"
    groups:
      backend-dependencies:
        patterns:
          - "*"

  # Angular frontend
  - package-ecosystem: "npm"
    directory: "/src/frontend/buddy"
    schedule:
      interval: "cron"
      cronjob: "0 6 * * 1,5" # Monday and Friday, 06:00
      timezone: "Europe/Copenhagen"
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    ignore:
      # @angular/build pins the TypeScript minor it supports (22.2: >=6.0 <6.1), so only patches
      # come on their own; a new minor or major moves together with Angular.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Keycloak theme build tooling
  - package-ecosystem: "npm"
    directory: "/themes/buddy/build"
    schedule:
      interval: "cron"
      cronjob: "0 6 * * 1,5" # Monday and Friday, 06:00
      timezone: "Europe/Copenhagen"
    groups:
      theme-build-dependencies:
        patterns:
          - "*"

  # Container base images
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "cron"
      cronjob: "0 6 * * 1,5" # Monday and Friday, 06:00
      timezone: "Europe/Copenhagen"

  - package-ecosystem: "docker"
    directory: "/src/backend/buddy"
    schedule:
      interval: "cron"
      cronjob: "0 6 * * 1,5" # Monday and Friday, 06:00
      timezone: "Europe/Copenhagen"
    # A new SDK tag must land together with global.json (and the runtime tag); Dependabot can't
    # change those in one PR, so it only refreshes the digests of the pinned tags.
    ignore:
      - dependency-name: "dotnet/sdk"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "dotnet/aspnet"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]

  - package-ecosystem: "docker"
    directory: "/src/frontend/buddy"
    schedule:
      interval: "cron"
      cronjob: "0 6 * * 1,5" # Monday and Friday, 06:00
      timezone: "Europe/Copenhagen"
    ignore:
      # The Node major is pinned in .nvmrc and package.json "engines"; change all three together.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Production compose images (Caddy, Postgres) and the Keycloak image, pinned by digest.
  - package-ecosystem: "docker-compose"
    directory: "/deploy"
    schedule:
      interval: "cron"
      cronjob: "0 6 * * 1,5" # Monday and Friday, 06:00
      timezone: "Europe/Copenhagen"

  - package-ecosystem: "docker"
    directory: "/deploy/azure/keycloak"
    schedule:
      interval: "cron"
      cronjob: "0 6 * * 1,5" # Monday and Friday, 06:00
      timezone: "Europe/Copenhagen"

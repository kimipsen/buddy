<fieldset class="min-w-0 space-y-3">
  <legend class="text-base font-semibold">
    {{ card() }}
    <span class="ml-1 text-sm font-normal text-slate-500 dark:text-slate-400">{{ hint() }}</span>
  </legend>

  @for (group of suggestions(); track group.labelKey) {
    @if (group.cards.length > 0) {
      <div>
        <p
          class="mb-1 text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400"
        >
          {{ group.labelKey | translate }}
        </p>
        <div class="flex flex-wrap gap-2">
          @for (suggestion of group.cards; track suggestion.title) {
            <button
              type="button"
              class="inline-flex items-center gap-1.5 rounded-full border px-3 py-1 text-sm font-medium transition"
              [class.border-emerald-500]="isPicked(suggestion)"
              [class.bg-emerald-50]="isPicked(suggestion)"
              [class.dark:bg-emerald-950]="isPicked(suggestion)"
              [class.text-emerald-800]="isPicked(suggestion)"
              [class.dark:text-emerald-200]="isPicked(suggestion)"
              [class.border-slate-300]="!isPicked(suggestion)"
              [class.dark:border-slate-600]="!isPicked(suggestion)"
              [class.text-slate-700]="!isPicked(suggestion)"
              [class.dark:text-slate-200]="!isPicked(suggestion)"
              [attr.aria-pressed]="isPicked(suggestion)"
              (click)="pick(suggestion)"
            >
              <span aria-hidden="true">{{ suggestion.icon }}</span>
              {{ suggestion.title }}
            </button>
          }
        </div>
      </div>
    }
  }

  <div class="flex gap-2">
    <div class="w-20 shrink-0">
      <label class="sr-only" [for]="idPrefix() + 'Icon'">{{
        'firstThen.guardian.iconLabel' | translate: { card: card() }
      }}</label>
      <input
        [id]="idPrefix() + 'Icon'"
        type="text"
        maxlength="16"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-center text-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100"
        placeholder="🙂"
        [ngModel]="icon()"
        [ngModelOptions]="{ standalone: true }"
        (ngModelChange)="icon.set($event)"
      />
    </div>
    <div class="min-w-0 flex-1">
      <label class="sr-only" [for]="idPrefix() + 'Title'">{{
        'firstThen.guardian.titleLabel' | translate: { card: card() }
      }}</label>
      <input
        [id]="idPrefix() + 'Title'"
        type="text"
        maxlength="60"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-emerald-500 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100"
        [placeholder]="'firstThen.guardian.titleLabel' | translate: { card: card() }"
        [ngModel]="title()"
        [ngModelOptions]="{ standalone: true }"
        (ngModelChange)="title.set($event)"
      />
    </div>
  </div>
</fieldset>

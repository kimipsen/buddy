name: CodeQL

on:
  pull_request:
    branches: [master]
    paths:
      - "src/backend/**"
      - "src/frontend/**"
      - "global.json"
      - ".github/workflows/codeql.yml"
  push:
    branches: [master]
    paths:
      - "src/backend/**"
      - "src/frontend/**"
      - "global.json"
      - ".github/workflows/codeql.yml"
  # Weekly, so new CodeQL queries also run against code that hasn't changed.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

# Least privilege for the GITHUB_TOKEN; a job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.name }})
    runs-on: ubuntu-latest
    # Uploads the results to the repository's code scanning alerts.
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built for real (manual build mode), so the extractor sees the same compilation as the
          # SDK pinned in global.json -- .NET 11 preview with C# preview features.
          # The excluded queries misread that preview code: they flag nearly every local that is
          # read on the next line (`var command = ...; await bus.InvokeAsync(command)`) and
          # implicit conversions to union types, ~1000 false positives with no real hit among them.
          - name: backend
            language: csharp
            build-mode: manual
            config: |
              paths:
                - src/backend
              query-filters:
                - exclude:
                    id: cs/useless-assignment-to-local
                - exclude:
                    id: cs/useless-upcast
                - exclude:
                    id: cs/useless-cast-to-self
          # TypeScript needs no build. Generated output, dependencies and reports stay out.
          - name: frontend
            language: javascript-typescript
            build-mode: none
            config: |
              paths:
                - src/frontend/buddy
              paths-ignore:
                - src/frontend/buddy/node_modules
                - src/frontend/buddy/dist
                - src/frontend/buddy/coverage
                - src/frontend/buddy/reports
                - src/frontend/buddy/playwright-report
                - src/frontend/buddy/test-results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same SDK as the devcontainer, pinned in global.json at the repo root.
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # security-and-quality adds the maintainability queries to the default security suite.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          config: ${{ matrix.config }}

      - name: Build backend
        if: matrix.build-mode == 'manual'
        run: |
          dotnet restore src/backend/backend.slnx
          dotnet build src/backend/backend.slnx --no-restore --configuration Release

      # Uploaded below, after the generated-code results are filtered out.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: "/language:${{ matrix.language }}"
          upload: failure-only
          output: sarif-results

      # A traced C# build ignores paths-ignore, so the source-generator output CodeQL writes under
      # obj/ (Marten/JasperFx evolvers) and the committed Wolverine handler code in
      # Internal/Generated (task codegen:backend) are analysed too. Their results aren't ours to
      # fix; drop them.
      - name: Drop results in generated code
        run: |
          for f in sarif-results/*.sarif; do
            jq '.runs[].results |= map(select(
                  (.locations[0].physicalLocation.artifactLocation.uri // "") | test("(^|/)(obj|Internal/Generated)/") | not))' \
              "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done

      - name: Upload results
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: sarif-results
          category: "/language:${{ matrix.language }}"

<main class="grid min-h-dvh place-items-center bg-slate-100 dark:bg-slate-950 px-6 py-10">
  <div class="w-full max-w-md rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-6 shadow-xl shadow-slate-950/10 sm:p-8">
    @if (verified()) {
      <h2 class="text-xl font-semibold tracking-normal">{{ 'verifyEmail.successTitle' | translate }}</h2>
      <button
        type="button"
        class="mt-6 flex h-11 w-full items-center justify-center rounded-lg bg-slate-950 px-4 text-sm font-semibold text-white transition hover:bg-slate-800 dark:bg-emerald-600 dark:hover:bg-emerald-500"
        (click)="goToApp()"
      >
        {{ 'verifyEmail.goToAppButton' | translate }}
      </button>
    } @else {
      <h2 class="text-xl font-semibold tracking-normal">{{ 'verifyEmail.title' | translate }}</h2>

      @if (isAuthenticated()) {
        <button
          type="button"
          class="mt-6 flex h-11 w-full items-center justify-center rounded-lg bg-slate-950 px-4 text-sm font-semibold text-white transition hover:bg-slate-800 dark:bg-emerald-600 dark:hover:bg-emerald-500 disabled:opacity-50"
          [disabled]="verifying()"
          (click)="verify()"
        >
          {{ 'verifyEmail.verifyButton' | translate }}
        </button>

        @if (verifyError(); as message) {
          <p class="mt-3 text-sm text-red-600 dark:text-red-400">{{ message | translate }}</p>
        }
      } @else {
        <p class="mt-2 text-sm leading-6 text-slate-600 dark:text-slate-300">{{ 'verifyEmail.logInPrompt' | translate }}</p>
        <button
          type="button"
          class="mt-6 flex h-11 w-full items-center justify-center rounded-lg bg-slate-950 px-4 text-sm font-semibold text-white transition hover:bg-slate-800 dark:bg-emerald-600 dark:hover:bg-emerald-500"
          (click)="logInToVerify()"
        >
          {{ 'verifyEmail.logInButton' | translate }}
        </button>
      }
    }
  </div>
</main>

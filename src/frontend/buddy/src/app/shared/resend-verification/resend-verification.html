<div class="grid gap-2">
  <button
    type="button"
    class="justify-self-start rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 disabled:opacity-50 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 dark:hover:bg-slate-700"
    [disabled]="sending.busy()"
    (click)="resend()"
  >
    {{ 'verifyEmail.resend.button' | translate }}
  </button>

  @if (sending.state(); as state) {
    @if (state.status === 'error') {
      <p class="text-sm text-red-600 dark:text-red-400">{{ state.message | translate }}</p>
    } @else if (sent()) {
      <p role="status" class="text-sm text-emerald-700 dark:text-emerald-400">
        {{ 'verifyEmail.resend.sent' | translate }}
      </p>
    }
  }
</div>

<app-page backLink="/guardian" [backLabel]="'admin.backToDashboard' | translate">
  <div class="mb-8">
    <p
      class="text-sm font-medium uppercase tracking-[0.16em] text-emerald-700 dark:text-emerald-400"
    >
      {{ 'admin.eyebrow' | translate }}
    </p>
    <h2 class="mt-2 text-3xl font-semibold tracking-normal">{{ 'admin.title' | translate }}</h2>
  </div>

  <div class="space-y-6">
    <app-my-profile class="block" />
    <app-manage-children class="block" />
    <app-manage-calendars class="block" />
    <app-manage-groups class="block" />
    @if (features.enabled('mealplanAiAssistant')) {
      <app-ai-provider-settings class="block" />
    }
    <app-download-my-data class="block" />
    <app-delete-account class="block" />
  </div>
</app-page>

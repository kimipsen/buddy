<form class="space-y-6" (ngSubmit)="submit()">
  <app-first-then-card-picker
    idPrefix="firstThenFirst"
    [card]="'firstThen.first' | translate"
    [hint]="'firstThen.guardian.firstHint' | translate"
    [suggestions]="firstSuggestions()"
    [(title)]="firstTitle"
    [(icon)]="firstIcon"
  />

  <app-first-then-card-picker
    idPrefix="firstThenThen"
    [card]="'firstThen.then' | translate"
    [hint]="'firstThen.guardian.thenHint' | translate"
    [suggestions]="thenSuggestions()"
    [(title)]="thenTitle"
    [(icon)]="thenIcon"
  />

  <div>
    <label class="mb-1 block text-sm font-semibold" for="firstThenLength">{{
      'firstThen.guardian.length' | translate
    }}</label>
    <select
      id="firstThenLength"
      name="thenMinutes"
      class="rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100"
      [ngModel]="lengthValue(thenMinutes())"
      (ngModelChange)="setLength($event)"
    >
      @for (minutes of lengths; track minutes) {
        <option [value]="lengthValue(minutes)">
          {{
            minutes === null
              ? ('firstThen.guardian.noLength' | translate)
              : ('firstThen.minutes' | translate: { count: minutes })
          }}
        </option>
      }
    </select>
  </div>

  @if (confirming()) {
    <div
      class="space-y-3 rounded-lg border border-amber-300 bg-amber-50 p-4 dark:border-amber-700 dark:bg-amber-950"
      role="alert"
    >
      <p class="text-sm font-semibold text-amber-900 dark:text-amber-100">
        {{ 'firstThen.guardian.replace' | translate }}
      </p>
      <div class="flex gap-2">
        <button
          type="submit"
          class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-emerald-500 disabled:opacity-50"
          [disabled]="busy()"
        >
          {{ 'firstThen.guardian.replaceConfirm' | translate }}
        </button>
        <button
          type="button"
          class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 hover:border-slate-400 dark:border-slate-600 dark:text-slate-300 dark:hover:border-slate-500"
          (click)="cancel()"
        >
          {{ 'firstThen.guardian.cancel' | translate }}
        </button>
      </div>
    </div>
  } @else {
    <button
      type="submit"
      class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-emerald-500 disabled:opacity-50"
      [disabled]="!valid() || busy()"
    >
      {{ 'firstThen.guardian.show' | translate: { name: childName() } }}
    </button>
  }
</form>

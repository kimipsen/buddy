<div class="fixed inset-0 z-40 flex items-center justify-center px-4">
  <!-- Pointer-only dismiss target behind the panel; keyboard users close with Escape. -->
  <div class="absolute inset-0 bg-slate-950/50" aria-hidden="true" (click)="close()"></div>

  <div
    #panel
    role="dialog"
    aria-modal="true"
    aria-labelledby="rule-editor-title"
    tabindex="-1"
    class="relative max-h-[90dvh] w-full max-w-2xl overflow-y-auto rounded-lg border border-slate-200 bg-white p-6 shadow-lg focus:outline-none dark:border-slate-800 dark:bg-slate-900"
  >
    <h3
      id="rule-editor-title"
      class="text-lg font-semibold tracking-normal text-slate-950 dark:text-slate-50"
    >
      {{ (isEdit() ? 'houseRules.editor.editTitle' : 'houseRules.editor.addTitle') | translate }}
    </h3>

    <form class="mt-4 space-y-4" (submit)="$event.preventDefault(); submit()">
      <div>
        <label
          for="rule-editor-title-input"
          class="block text-sm font-medium text-slate-700 dark:text-slate-300"
          >{{ 'houseRules.editor.titleLabel' | translate }}</label
        >
        <input
          #titleInput
          id="rule-editor-title-input"
          type="text"
          class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100"
          [value]="title()"
          [attr.maxlength]="maxTitleLength"
          (input)="onTitleInput($event)"
        />
      </div>

      <app-markdown-editor
        inputId="rule-editor-body"
        [label]="'houseRules.editor.bodyLabel' | translate"
        [hint]="'houseRules.editor.bodyHint' | translate"
        [maxLength]="maxBodyLength"
        [(value)]="body"
      />

      @if (isEdit()) {
        <div class="flex items-start gap-3 text-sm text-slate-700 dark:text-slate-300">
          <app-toggle
            [checked]="minorFix()"
            [ariaLabel]="'houseRules.editor.minorFix' | translate"
            (checkedChange)="minorFix.set($event)"
          />
          <span aria-hidden="true">{{ 'houseRules.editor.minorFix' | translate }}</span>
        </div>
      }

      @if (error(); as message) {
        <p class="text-sm text-red-600 dark:text-red-400" role="alert">{{ message | translate }}</p>
      }

      <div class="flex justify-end gap-3">
        <button
          type="button"
          class="rounded-lg px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800"
          [disabled]="saving()"
          (click)="close()"
        >
          {{ 'houseRules.editor.cancel' | translate }}
        </button>
        <button
          type="submit"
          class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-emerald-500 disabled:opacity-50"
          [disabled]="!canSave()"
        >
          {{ (saving() ? 'houseRules.editor.saving' : 'houseRules.editor.save') | translate }}
        </button>
      </div>
    </form>
  </div>
</div>

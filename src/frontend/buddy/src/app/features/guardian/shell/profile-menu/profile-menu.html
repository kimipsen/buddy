<div class="relative">
  <button
    type="button"
    class="grid size-10 place-items-center rounded-full border border-slate-300 bg-white text-slate-700 transition hover:border-slate-400 hover:text-slate-950 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2"
    aria-haspopup="true"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="size-5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.5 20.25a7.5 7.5 0 0 1 15 0" />
    </svg>
    <span class="sr-only">Open account menu</span>
  </button>

  @if (open()) {
    <div class="fixed inset-0 z-10" (click)="close()"></div>

    <div class="absolute right-0 z-20 mt-2 w-48 overflow-hidden rounded-lg border border-slate-200 bg-white py-1 shadow-lg">
      <a
        routerLink="/guardian/admin"
        class="block px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100"
        (click)="close()"
      >
        Settings
      </a>
      <button
        type="button"
        class="block w-full px-4 py-2 text-left text-sm font-medium text-slate-700 hover:bg-slate-100"
        (click)="logout()"
      >
        Sign out
      </button>
    </div>
  }
</div>

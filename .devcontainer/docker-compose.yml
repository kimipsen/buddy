services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - ../..:/workspaces:cached

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Ensure services start in the dev network and depend on DB + RabbitMQ.
    depends_on:
      - db
      - rabbitmq
      - redis
      - mailpit
    networks:
      - buddy_network
    # Provide credentials and RabbitMQ connection info to the app from the shared .env
    env_file:
      - .env
    environment:
      RABBITMQ__HOST: rabbitmq
      RABBITMQ__PORT: "5672"
      RABBITMQ__USERNAME: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ__PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      REDIS__HOST: redis
      REDIS__PORT: "6379"
      REDIS__PASSWORD: ${REDIS_PASSWORD}
      MAIL__HOST: mailpit
      MAIL__PORT: "1025"
      MAIL__USERNAME: ${MAILPIT_USERNAME}
      MAIL__PASSWORD: ${MAILPIT_PASSWORD}
    
    # Uncomment to connect as root instead. More info: https://aka.ms/dev-containers-non-root.
    # user: root

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally. 
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  db:
    image: postgres:18
    restart: unless-stopped
    volumes:
      # PostgreSQL 18+ images store data in a major-version subdirectory, so the
      # mount belongs at /var/lib/postgresql, not /var/lib/postgresql/data.
      - postgres-data:/var/lib/postgresql
    # Credentials live in .devcontainer/.env (gitignored). See .env.example.
    env_file:
      - .env
    networks:
      - buddy_network
      
    # Add "forwardPorts": ["5432"] to **devcontainer.json** to forward PostgreSQL locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    restart: unless-stopped
    # Credentials live in .devcontainer/.env (gitignored). See .env.example.
    env_file:
      - .env
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      # Disable theme caching so edits under themes/buddy show up without a restart.
      KC_SPI_THEME_STATIC_MAX_AGE: "-1"
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
    command: start-dev
    depends_on:
      - db
    ports:
      - 9080:8080
    volumes:
      - ../themes/buddy:/opt/keycloak/themes/buddy
    networks:
      - buddy_network

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    # Credentials live in .devcontainer/.env (gitignored). See .env.example.
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:15672 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - buddy_network
    depends_on:
      - db

  redis:
    image: redis:7
    restart: unless-stopped
    # Credentials live in .devcontainer/.env (gitignored). See .env.example.
    env_file:
      - .env
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - buddy_network

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    # Mailpit settings can be controlled via .env (optional).
    env_file:
      - .env
    ports:
      - 2025:1025   # SMTP
      - 9025:8025   # Web UI
    volumes:
        - mailpit-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8025 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - buddy_network

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  mailpit-data:

networks:
  buddy_network:
    driver: bridge
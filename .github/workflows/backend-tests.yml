name: Backend tests

on:
  pull_request:
    paths:
      - "src/backend/**"
      - ".github/workflows/backend-tests.yml"
      - ".github/scripts/coverage-report.sh"
  push:
    branches: [master]
    paths:
      - "src/backend/**"
      - ".github/workflows/backend-tests.yml"
      - ".github/scripts/coverage-report.sh"

# Least privilege for the GITHUB_TOKEN; a job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Writes the coverage comment on the pull request.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same SDK as the devcontainer, pinned in global.json at the repo root.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/backend/backend.slnx

      - name: Build
        run: dotnet build src/backend/backend.slnx --no-restore --configuration Release

      # Testcontainers needs a Docker daemon, which the ubuntu-latest runner provides natively.
      # coverage.runsettings: coverlet, Cobertura format, the API assembly only.
      - name: Test
        run: >-
          dotnet test src/backend/backend.slnx --no-build --configuration Release
          --logger "console;verbosity=normal"
          --settings src/backend/coverage.runsettings --results-directory coverage

      - name: Coverage report
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty on a fork's pull request: its token can't comment, so the report goes to the job
          # summary only.
          PR_NUMBER: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number || '' }}
        run: .github/scripts/coverage-report.sh Backend "$(find coverage -name coverage.cobertura.xml | head -n 1)"

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: coverage/**/coverage.cobertura.xml
          retention-days: 14

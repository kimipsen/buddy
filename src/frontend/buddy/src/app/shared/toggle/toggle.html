<button
  type="button"
  role="switch"
  [attr.aria-checked]="checked()"
  [attr.aria-label]="ariaLabel() || null"
  [disabled]="disabled()"
  class="relative inline-flex shrink-0 items-center rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-1 disabled:cursor-not-allowed disabled:opacity-60"
  [class.h-6]="size() === 'default'"
  [class.w-10]="size() === 'default'"
  [class.h-9]="size() === 'lg'"
  [class.w-16]="size() === 'lg'"
  [class.bg-emerald-500]="checked()"
  [class.bg-slate-300]="!checked()"
  [class.dark:bg-slate-600]="!checked()"
  (click)="toggle()"
>
  <span
    class="inline-block rounded-full bg-white shadow transition-transform"
    [class.size-4]="size() === 'default'"
    [class.translate-x-4]="size() === 'default' && checked()"
    [class.translate-x-1]="(size() === 'default' && !checked()) || (size() === 'lg' && !checked())"
    [class.size-7]="size() === 'lg'"
    [class.translate-x-6]="size() === 'lg' && checked()"
  ></span>
</button>

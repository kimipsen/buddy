<p class="text-xs font-semibold uppercase tracking-wide text-slate-400">{{ 'events.types.nameUpdated.title' | translate }}</p>
<p class="mt-1 text-sm font-medium">
  {{
    'events.types.nameUpdated.description'
      | translate
        : {
            before: data().before.givenName + ' ' + data().before.familyName,
            after: data().after.givenName + ' ' + data().after.familyName
          }
  }}
</p>
<p class="mt-1 text-xs text-slate-500 dark:text-slate-400">{{ data().occurredAt | userDate: 'medium' }}</p>
